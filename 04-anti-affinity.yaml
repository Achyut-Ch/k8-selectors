apiVersion: v1
kind: Pod
metadata:
  name: nginx-anti-affinity
  labels:
    env: test
spec:
  affinity:
    nodeAffinity:
      # hard rule
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: topolocgy.kubernetes.io/zone
            operator: NotIn
            values:
            - us-east-1d
            - us-east-1c

  containers:
  - name: nginx
    image: nginx  