apiVersion: v1
kind: Pod
metadata:
  name: nginx-tolerated
  labels:
    env: test
  spec:
    containers:
    - name: nginx
      image: nginx
    # asing vor vip room
    nodeSelector:
      Project: roboshop
    # showing booking confirmation
    tolerations:
    - key: "project"
      operator: "Equal"
      value: "roboshop"
      effect: "NoExecute"